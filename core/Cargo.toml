[package]
name = "dofus-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
pcap = ["dep:pcap"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
byteorder = "1.4"
hex = "0.4"
regex = "1.10"
once_cell = "1.19"
anyhow = "1.0"
pcap = { version = "1.1", optional = true }

[[bin]]
name = "pcap2flow"
path = "src/bin/pcap2flow.rs"
required-features = ["pcap"]

[[bin]]
name = "parse_messages"
path = "src/bin/parse_messages.rs"

[[bin]]
name = "ids_lookup"
path = "src/bin/ids_lookup.rs"